services:
  app:
    image: ${IMAGE:-ghcr.io/rodow/rwojtko.fr:latest}
    container_name: rwojtko_app
    restart: unless-stopped
    environment:
      # Le TLS est géré par le Caddy frontal (/opt/caddy) : ici, HTTP simple sur le réseau « web ».
      - SERVER_NAME=${SERVER_NAME}
      - APP_ENV=prod
      - APP_SECRET=${APP_SECRET}
    cap_drop:
      - ALL
    cap_add:
      # Écouter sur le port 80 sans être root.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - web

networks:
  web:
    external: true
