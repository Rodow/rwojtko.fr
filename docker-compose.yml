services:
  app:
    image: ${IMAGE:-ghcr.io/rodow/rwojtko.fr:latest}
    container_name: rwojtko_app
    restart: unless-stopped
    environment:
      # Domain served by Caddy (TLS obtained automatically via Let's Encrypt).
      - SERVER_NAME=${SERVER_NAME}
      - APP_ENV=prod
      - APP_SECRET=${APP_SECRET}
    ports:
      # 80 ne sert qu'à la redirection HTTP->HTTPS (et au challenge ACME).
      # Aucune logique applicative n'est exposée en clair.
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      # TLS certificates and Caddy state must persist across restarts.
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      # Bind to port 443 as a non-root user.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - rwojtko_network

volumes:
  caddy_data:
  caddy_config:

networks:
  rwojtko_network:
    driver: bridge