services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: rwojtko_php
    restart: unless-stopped
    volumes:
      - .:/var/www/html:cached
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-secret}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      - MAILER_DSN=smtp://mailcatcher:1025
    depends_on:
      database:
        condition: service_healthy
    networks:
      - rwojtko_network

  caddy:
    image: caddy:2-alpine
    container_name: rwojtko_caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - .:/var/www/html:cached
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php
    networks:
      - rwojtko_network

  database:
    image: postgres:16-alpine
    container_name: rwojtko_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rwojtko_network

  mailcatcher:
    image: schickling/mailcatcher
    container_name: rwojtko_mailcatcher
    restart: unless-stopped
    ports:
      - "${MAILCATCHER_WEB_PORT:-1080}:1080"
    networks:
      - rwojtko_network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  rwojtko_network:
    driver: bridge